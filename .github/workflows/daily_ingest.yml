name: Daily Ingestion Pipeline

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: "0 19 * * *" # Every day at 7:00 PM UTC (8:00 PM WAT)

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
  TELEGRAM_API_KEY: ${{ secrets.TELEGRAM_API_KEY }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: .
        run: |
          pip install --upgrade pip
          pip install playwright pydantic python-dotenv \
                    langchain langchain-core langchain-google-genai \
                    openai pinecone
          playwright install firefox
          playwright install-deps firefox

      - name: Restore visited_urls.txt
        uses: actions/cache@v4
        with:
          path: ./visited_urls.txt
          key: visited-urls-${{ github.run_id }}
          restore-keys: |
            visited-urls-

      - name: Run pipeline
        working-directory: .
        run: python daily_ingest.py

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: |
            ./pipeline_report.json
            ./scraped_today.jsonl
            ./classified_today.jsonl
            ./logs/daily_ingest.log

      - name: Save visited_urls.txt
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ./visited_urls.txt
          key: visited-urls-${{ github.run_id }}
