name: Daily Ingestion Pipeline

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: "0 19 * * *" # Every day at 7:00 PM UTC (8:00 PM WAT)

permissions:
  contents: write

concurrency:
  group: daily-ingestion
  cancel-in-progress: false

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
  TELEGRAM_API_KEY: ${{ secrets.TELEGRAM_API_KEY }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: .
        run: |
          pip install --upgrade pip
          pip install playwright pydantic python-dotenv \
                    langchain langchain-core langchain-google-genai \
                    openai pinecone
          playwright install firefox
          playwright install-deps firefox

      - name: Run pipeline
        # Leave time to publish confirmed progress even if ingestion times out.
        timeout-minutes: 105
        working-directory: .
        run: python daily_ingest.py

      - name: Back up visited history and pending articles
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ./visited_urls.txt
            ./retry_urls.txt
            ./scraped_today.jsonl
          if-no-files-found: error
          retention-days: 90

      - name: Commit visited and retry URLs to the repository
        if: always() && steps.checkout.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/publish_visited_urls.py

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: |
            ./pipeline_report.json
            ./scraped_today.jsonl
            ./classified_today.jsonl
            ./logs/daily_ingest.log
